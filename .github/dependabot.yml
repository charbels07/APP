# Dependabot: proposes updates of the libraries every week, as pull requests that go through the
# same checks as any change (.github/workflows/checks.yml). Turn on "Dependabot alerts" and
# "Dependabot security updates" in GitHub → Settings → Code security too (docs/SECURITY.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      # The Expo packages move together (one pull request), as `npx expo install` expects.
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "jest-expo"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # A new Expo SDK, and the React Native and React versions it brings, is moved by hand
      # with `npx expo install --fix` and Expo's upgrade guide, then tested on devices: never
      # one package at a time. (For React Native 0.x a "minor" number is a new version.)
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
